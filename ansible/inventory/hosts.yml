# inventory/hosts.yml
all:
  hosts:
     Zero-SquareBOX:
      ansible_host: 192.168.0.129 # Replace with your target host's IP/hostname
      ansible_user: root # Replace with your SSH username

  vars:
    ansible_python_interpreter: /usr/bin/python3 # Explicitly set the Python 3 interpreter
    app_dir: /opt/tornado-tutorial
    venv_dir: "{{ app_dir }}/venv"
    app_user: www-data # Dedicated user for the application

